[package]
name = "uefi-demo"
version = "1.15.0"
license = "GPL3"
edition = "2024"
build = "build.rs"
publish = false

# [[bin]]
# path = "main.rs"
# name = "uefi-demo"

[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "0.33", features = ["panic_handler", "global_allocator"] }
minipng = "=0.1.1"

slint = { version = "1.14", default-features = false, features = ["compat-1-2", "renderer-software", "libm", "log", "unsafe-single-threaded"] }
log = "0.4.21"

[build-dependencies]
slint-build = "1.14"

[dependencies]
minipng = "=0.1.1"
uefi = "=0.33.0"
